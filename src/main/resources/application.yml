server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: mpl-one
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mpl_one}
    username: ${DB_USERNAME:mpl_one}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mpl-one}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mpl-one/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
