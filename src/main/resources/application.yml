server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: mpl-one
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/mpl_one}
    username: ${DB_USERNAME:mpl_one}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          mpl-bff:
            provider: keycloak
            client-id: mpl-bff
            client-secret: ${KEYCLOAK_BFF_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mpl-one}
            authorization-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mpl-one}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_BACKCHANNEL:http://localhost:8180/realms/mpl-one}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_BACKCHANNEL:http://localhost:8180/realms/mpl-one}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mpl-one/protocol/openid-connect/certs}
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mpl-one}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mpl-one/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  auth:
    post-logout-uri: ${POST_LOGOUT_URI:http://localhost:8081/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
