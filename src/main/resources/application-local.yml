spring:
  flyway:
    locations: classpath:db/migration,classpath:db/local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: mpl-web
      use-pkce-with-authorization-code-grant: true
      scopes: openid,profile

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
