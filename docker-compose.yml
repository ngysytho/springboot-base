services:
  app-db:
    image: postgres:18
    environment:
      POSTGRES_DB: mpl_one
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["app-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes: ["keycloak-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    depends_on:
      keycloak-db:
        condition: service_healthy
  # Explicit one-shot Admin API synchronization; never runs during API startup.
  keycloak-config:
    profiles: ["keycloak-config"]
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    restart: "no"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_CONFIG_URL:-http://keycloak:8080}
      KEYCLOAK_USER: ${KEYCLOAK_CONFIG_ADMIN:-${KEYCLOAK_ADMIN}}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_CONFIG_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD}}
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_CLIENTID: admin-cli
      KEYCLOAK_SSLVERIFY: "true"
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: ${KEYCLOAK_CONFIG_FILES:-/config/mpl-one-realm.json}
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_REMOTESTATE_ENABLED: "false"
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_CLIENTSCOPE: no-delete
      IMPORT_MANAGED_SCOPEMAPPING: no-delete
      IMPORT_MANAGED_CLIENTSCOPEMAPPING: no-delete
      IMPORT_MANAGED_AUTHENTICATIONFLOW: no-delete
      IMPORT_MANAGED_GROUP: no-delete
      IMPORT_MANAGED_REQUIREDACTION: no-delete
      IMPORT_MANAGED_COMPONENT: no-delete
      IMPORT_MANAGED_SUBCOMPONENT: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDER: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDERMAPPER: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONPOLICIES: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONSCOPES: no-delete
      IMPORT_MANAGED_MESSAGEBUNDLES: no-delete
      IMPORT_MANAGED_WORKFLOW: no-delete
      IMPORT_USERS_MERGEROLES: "true"
      IMPORT_USERS_MERGEGROUPS: "true"
      LOGGING_LEVEL_HTTP: "OFF"
      LOGGING_LEVEL_REALMCONFIG: "OFF"
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?Set BFF secret}
    volumes:
      - ./src/main/resources/keycloak/mpl-one-realm.json:/config/mpl-one-realm.json:ro
    depends_on:
      keycloak:
        condition: service_started
  api:
    profiles: ["api"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_URL: jdbc:postgresql://app-db:5432/mpl_one
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?Set BFF secret}
      KEYCLOAK_BACKCHANNEL: http://keycloak:8080/realms/mpl-one
      KEYCLOAK_ISSUER: http://localhost:8180/realms/mpl-one
      KEYCLOAK_JWKS: http://keycloak:8080/realms/mpl-one/protocol/openid-connect/certs
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_started
volumes:
  app-data:
  keycloak-data:
