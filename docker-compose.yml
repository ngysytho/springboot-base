services:
  app-db:
    image: postgres:18
    environment:
      POSTGRES_DB: mpl_one
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["app-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes: ["keycloak-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./src/main/resources/keycloak:/opt/keycloak/data/import:ro"]
    depends_on:
      keycloak-db:
        condition: service_healthy
  api:
    profiles: ["api"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_URL: jdbc:postgresql://app-db:5432/mpl_one
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/mpl-one
      KEYCLOAK_JWKS: http://keycloak:8080/realms/mpl-one/protocol/openid-connect/certs
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_started
volumes:
  app-data:
  keycloak-data:
